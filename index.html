<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Codex de Builds — RO Classic Idle</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Conceito: "Códice de Rune-Midgard" — janelas azul-noite do cliente do RO, ouro de zeny como acento,
   títulos em letra de inscrição; barra lateral de classes + página de verbete com infobox à direita. */
:root{
  --f-display:"Marcellus","Palatino Linotype",Georgia,serif;
  --f-body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Consolas,monospace;
  /* tema claro */
  --bg:#eef1f7; --bg2:#ffffff; --bg3:#e7ebf3; --bg4:#d9e0ee; --line:#d3daea; --line2:#b9c4da;
  --tx:#18203a; --tx2:#3a4566; --mut:#6b7593; --acc:#a8730f; --acc2:#8a5c00; --accbg:#f6ead0; --link:#2a5db0;
  --ok:#1d8a52; --okbg:#ddf3e6; --warn:#b06a00; --warnbg:#fbeed6; --bad:#c2372f; --badbg:#fbe1df;
  --str:#c8473a; --agi:#25935a; --vit:#c4741c; --int:#2f6ccf; --dex:#9a7a00; --luk:#b0429f;
  --hero:linear-gradient(135deg,#dfe6f5,#f4ecda); --ink:#fff; --shade:0 1px 2px #18203a14,0 6px 18px #18203a12;
  --tz-bg:#fbf1d6; --tz-fg:#7a5200; --tu-bg:#dcf2e5; --tu-fg:#16673e; --tm-bg:#ebe1fb; --tm-fg:#5a2ca8; --ts-bg:#dce9fb; --ts-fg:#1f4f97;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f121b; --bg2:#161a26; --bg3:#1d2232; --bg4:#262c40; --line:#272e43; --line2:#38415c;
  --tx:#e9ecf5; --tx2:#c2c8da; --mut:#8790a9; --acc:#d4a832; --acc2:#e8c86a; --accbg:#2c2414; --link:#7fb2ff;
  --ok:#52d391; --okbg:#12301f; --warn:#f0a83e; --warnbg:#33240e; --bad:#f2675f; --badbg:#3a1616;
  --str:#f07466; --agi:#5fd697; --vit:#f4a65a; --int:#76a9ff; --dex:#f0d35a; --luk:#e383d8;
  --hero:linear-gradient(135deg,#232845,#1a1a24 60%,#2a2216); --ink:#0f121b; --shade:0 1px 0 #ffffff08 inset,0 10px 26px #0007;
  --tz-bg:#3a2f12; --tz-fg:#f6d48a; --tu-bg:#123326; --tu-fg:#8be3b4; --tm-bg:#2a1c40; --tm-fg:#c9a8ff; --ts-bg:#122a42; --ts-fg:#9cc9ff;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f121b; --bg2:#161a26; --bg3:#1d2232; --bg4:#262c40; --line:#272e43; --line2:#38415c;
  --tx:#e9ecf5; --tx2:#c2c8da; --mut:#8790a9; --acc:#d4a832; --acc2:#e8c86a; --accbg:#2c2414; --link:#7fb2ff;
  --ok:#52d391; --okbg:#12301f; --warn:#f0a83e; --warnbg:#33240e; --bad:#f2675f; --badbg:#3a1616;
  --str:#f07466; --agi:#5fd697; --vit:#f4a65a; --int:#76a9ff; --dex:#f0d35a; --luk:#e383d8;
  --hero:linear-gradient(135deg,#232845,#1a1a24 60%,#2a2216); --ink:#0f121b; --shade:0 1px 0 #ffffff08 inset,0 10px 26px #0007;
  --tz-bg:#3a2f12; --tz-fg:#f6d48a; --tu-bg:#123326; --tu-fg:#8be3b4; --tm-bg:#2a1c40; --tm-fg:#c9a8ff; --ts-bg:#122a42; --ts-fg:#9cc9ff;
  color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 var(--f-body)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
a{color:var(--link);cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
img.px{image-rendering:pixelated}
.num,td.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px}
/* ---------- header ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg2)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg2);border-bottom:1px solid var(--line);box-shadow:var(--shade)}
.hwrap{max-width:1440px;margin:auto;display:flex;align-items:center;gap:18px;padding-block:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:11px;cursor:pointer;flex:none}
.logo .gem{width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,var(--acc2),var(--acc));display:grid;place-items:center;color:var(--ink);box-shadow:0 3px 10px color-mix(in srgb,var(--acc) 40%,transparent)}
.logo b{display:block;font:20px/1.1 var(--f-display);letter-spacing:.02em}.logo small{display:block;color:var(--mut);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--tx2);padding:7px 12px;border-radius:8px;cursor:pointer;font:600 13.5px var(--f-body)}
nav button:hover{background:var(--bg3)}nav button.on{background:var(--accbg);color:var(--acc2)}
.hright{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.gs{position:relative;width:300px}
.gs input[type=search]{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--tx);padding:8px 12px 8px 36px;border-radius:9px;font:inherit;font-size:14px}
.gs input:focus{outline:none;border-color:var(--acc)}
.gs svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--mut);fill:none;stroke-width:2}
.gsr{display:none;position:absolute;top:44px;right:0;width:440px;max-height:72vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shade)}
.gsr .row{display:flex;gap:10px;align-items:center;padding:7px 12px;cursor:pointer}.gsr .row:hover{background:var(--bg3)}
.gsr .h{padding:9px 12px 3px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut)}
.tbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg3);color:var(--tx2);cursor:pointer;display:grid;place-items:center;font-size:16px}
/* ---------- layout ---------- */
.wrap{max-width:1440px;margin:auto;display:flex;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#side{width:290px;flex:none;padding:18px 12px 40px;border-right:1px solid var(--line);position:sticky;top:calc(59px + env(safe-area-inset-top,0px));height:calc(100vh - 59px);overflow:auto;background:var(--bg)}
#view{flex:1;min-width:0;padding:28px 36px 90px}
/* Sidebar: separadores de família sem all-caps */
.fam{margin:16px 6px 4px;display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:12px;font-weight:700;letter-spacing:0}
.star{margin-left:auto;flex:none;background:none;border:0;cursor:pointer;color:var(--mut);font-size:18px;line-height:1;padding:4px 6px;border-radius:7px;font-family:inherit}
.star:hover{color:var(--acc);background:var(--bg3)}.star.on{color:var(--acc)}.star:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
h1.t .star{font-size:26px;vertical-align:middle;margin-left:4px}
.fam.fav{color:var(--acc)}.favcard{border-color:var(--acc)}.favic{width:34px;text-align:center;color:var(--acc);font-size:26px}
.fam:after{content:"";flex:1;height:1px;background:var(--line)}
.bl{display:flex;gap:10px;align-items:center;padding:7px 9px;border-radius:9px;cursor:pointer;color:var(--tx2)}
.bl:hover{background:var(--bg3)}.bl.on{background:var(--bg2);color:var(--tx);box-shadow:inset 3px 0 var(--acc),var(--shade)}
.bl .ic{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--bg3)}.bl .ic img{width:24px;height:24px;object-fit:contain}
.bl b{font-weight:700;font-size:13.2px;line-height:1.3;display:block}.bl small{display:block;color:var(--mut);font-size:11.5px;line-height:1.25}
.filt{display:flex;flex-wrap:wrap;gap:5px}
/* ---------- chips/badges ---------- */
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:99px;font-size:11.5px;font-weight:700;border:1px solid var(--line2);background:var(--bg3);color:var(--tx2);white-space:nowrap}
.filt .chip{cursor:pointer}.filt .chip.on{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.t-zeny{background:var(--tz-bg);border-color:transparent;color:var(--tz-fg)}.t-up{background:var(--tu-bg);border-color:transparent;color:var(--tu-fg)}
.t-masmorra{background:var(--tm-bg);border-color:transparent;color:var(--tm-fg)}.t-suporte,.t-grupo{background:var(--ts-bg);border-color:transparent;color:var(--ts-fg)}
.badge{font-size:11px;font-weight:700;padding:1px 8px;border-radius:5px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-fora{background:var(--warnbg);color:var(--warn)}.b-nao{background:var(--badbg);color:var(--bad)}
/* ---------- verbete ---------- */
.crumbs{color:var(--mut);font-size:12.5px;margin-bottom:8px}
h1.t{font:400 34px/1.15 var(--f-display);margin:0;letter-spacing:.005em;text-wrap:balance}
h2.s{font:400 19px/1.3 var(--f-display);margin:36px 0 11px;padding-bottom:7px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;text-wrap:balance;letter-spacing:.01em}
h2.s .n{font:700 12px var(--f-num);color:var(--acc2);background:var(--accbg);border-radius:6px;padding:2px 7px}
.lead{font-size:16.5px;color:var(--tx2);margin:12px 0 0;max-width:70ch}
.page{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
.page>div{min-width:0}
.infobox{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:sticky;top:84px;box-shadow:var(--shade)}
.infobox .hero{background:var(--hero);display:grid;place-items:center;height:150px;border-bottom:1px solid var(--line)}
.infobox .hero img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 6px 8px #0005)}
.infobox .ttl{padding:10px 14px;font:22px var(--f-display);text-align:center;border-bottom:1px solid var(--line)}
.infobox dl{margin:0;padding:6px 16px 14px}.infobox dt{color:var(--mut);font-size:11px;margin-top:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}.infobox dd{margin:2px 0 0;font-size:13.8px}
.toc{border-top:1px solid var(--line);padding:12px 16px}.toc a{display:block;color:var(--tx2);font-size:13.3px;padding:3px 0}.toc a:hover{color:var(--acc2)}
.callout{border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);background:var(--accbg);border-radius:12px;padding:15px 18px;margin:20px 0;color:var(--tx)}
.callout .h{font-weight:800;color:var(--acc2);display:flex;gap:8px;align-items:center;margin-bottom:5px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin:10px 0}
ul.why{margin:0;padding:0;list-style:none}ul.why li{padding:8px 0 8px 26px;position:relative;border-bottom:1px dashed var(--line)}ul.why li:last-child{border:0}
ul.why li:before{content:"";position:absolute;left:6px;top:15px;width:8px;height:8px;transform:rotate(45deg);background:var(--acc);border-radius:1px}
.warn{border-left:3px solid var(--warn);background:var(--warnbg);padding:10px 14px;border-radius:0 9px 9px 0;margin:8px 0;color:var(--tx)}
/* ---------- atributos ---------- */
.phase{display:grid;grid-template-columns:160px 1fr;gap:16px;padding:15px 17px;border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--bg2);cursor:pointer}
.phase:hover{border-color:var(--line2)}.phase .lv b{font-size:15px;display:block}.phase .lv span{font:12px var(--f-num);color:var(--mut)}
.phase .pts.over{color:var(--bad)}
.sg{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sv{background:var(--bg3);border-radius:8px;padding:6px 9px}.sv span{font-size:10.5px;font-weight:800;letter-spacing:.08em}.sv b{display:block;font:700 18px/1.2 var(--f-num)}
.sv i{display:block;height:4px;border-radius:2px;margin-top:6px;background:var(--bg4);overflow:hidden}.sv i u{display:block;height:100%;border-radius:2px;transition:width .3s}
.phase .txt{grid-column:2;color:var(--tx2);font-size:14px}.phase .txt em{color:var(--mut);font-style:normal;display:block}
details.card summary{cursor:pointer;list-style:none}details.card summary::-webkit-details-marker{display:none}
details.card summary:before{content:"▸";color:var(--acc);margin-right:8px;display:inline-block;transition:transform .15s}details.card[open] summary:before{transform:rotate(90deg)}
.steps{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.steps table thead th{position:sticky;top:0;background:var(--bg3);z-index:1}
.steps tr.dec td{border-bottom:1px solid var(--line2)}
.addp{font:700 12px var(--f-num);white-space:nowrap}
.mejust{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:10px}.mejust label{display:flex;flex-direction:column;font-size:11.5px;font-weight:800;letter-spacing:.06em}
.mejust input{width:64px;background:var(--bg3);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:6px 8px;font:14px var(--f-num)}
.btn{background:var(--acc);color:var(--ink);border:0;border-radius:8px;padding:8px 14px;font:700 13px var(--f-body);cursor:pointer}.btn.ghost{background:var(--bg3);color:var(--tx2);border:1px solid var(--line)}
/* ---------- skills ---------- */
.sk{display:grid;grid-template-columns:28px minmax(170px,1.1fr) 70px 150px 2fr;gap:12px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.sk:last-child{border-bottom:0}.sk:hover{background:var(--bg3)}.sk img{width:24px;height:24px}.sk .lvl{font:13px var(--f-num);color:var(--tx2)}.sk .why{color:var(--mut);font-size:13px}
.sk.head{color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;border-bottom:1px solid var(--line2)}.sk.head:hover{background:none}
/* ---------- itens ---------- */
.eq{border:1px solid var(--line);border-radius:12px;margin:12px 0;background:var(--bg2);overflow:hidden}.eq.fase-final{border-color:color-mix(in srgb,var(--acc) 50%,transparent)}.eq.fase-inicio{opacity:.82}
.eq .eh{padding:11px 16px;background:var(--bg3);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.eq .eh b{font-size:14.5px}.eq .eh span{color:var(--mut);font-size:13px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;padding:12px}
.it{display:flex;gap:11px;background:var(--bg3);border:1px solid transparent;border-radius:10px;padding:9px 11px;cursor:pointer;min-width:0}.it:hover{border-color:var(--acc)}
.it .ic{width:40px;height:40px;flex:none;border-radius:9px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center}.it .ic img{max-width:30px;max-height:30px}
.it.card-it .ic{width:44px;height:62px;border-radius:6px;overflow:hidden}.it.card-it .ic img{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover;image-rendering:auto}
.it .bd{min-width:0}.it b{display:block;font-size:13.8px;line-height:1.3}.it small{display:block;color:var(--mut);font-size:12px;line-height:1.4}
/* ---------- rota ---------- */
.route{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.st2{background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer}.st2:hover{border-color:var(--acc)}
.st2 .mp{height:110px;background:var(--bg4) center/cover no-repeat;position:relative;image-rendering:pixelated}
.st2 .mp .lvb{position:absolute;left:8px;top:8px;background:var(--bg2);color:var(--acc2);font:700 12px var(--f-num);border-radius:6px;padding:2px 8px;box-shadow:var(--shade)}
.st2 .bd{padding:9px 12px}.st2 b{display:block;font-size:13.8px;line-height:1.3}.st2 .loot-num{font:700 15px var(--f-num);color:var(--acc2);display:block;margin-top:2px}.st2 small{color:var(--mut);font-size:12px;display:block;line-height:1.35;margin-top:3px}
.mobs{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;align-items:flex-end}.mobs img{height:40px;max-width:52px;object-fit:contain}
.mapview{height:220px;border-radius:10px;background:var(--bg4) center/contain no-repeat;margin-bottom:12px;image-rendering:pixelated}
/* ---------- início ---------- */
.hero2{border:1px solid var(--line);border-radius:18px;padding:36px 36px;background:var(--hero);box-shadow:var(--shade);display:flex;gap:32px;align-items:center;position:relative;overflow:hidden}.hero2::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 90% 50%,color-mix(in srgb,var(--acc) 12%,transparent),transparent);pointer-events:none}
.hero2 h1{margin:0;font:400 44px/1.05 var(--f-display);letter-spacing:-.01em;text-wrap:balance}.hero2 p{color:var(--tx2);margin:10px 0 0;max-width:68ch;font-size:15.5px}
.hero2 .mascots{display:flex;gap:8px;align-items:flex-end;flex:none}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stats4 div{background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:0 0 12px 12px;padding:14px 16px 13px}.stats4 b{font:700 28px/1 var(--f-num);display:block;color:var(--acc2);margin-bottom:4px}.stats4 span{color:var(--mut);font-size:12.5px;line-height:1.3}
.tree{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.fcard{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
.fcard .top{display:flex;align-items:center;gap:12px;font:18px var(--f-display);margin-bottom:8px;padding-bottom:9px;border-bottom:1px solid var(--line)}.fcard .top img,.fcard .top .ph{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 4px #0003)}
.cls{display:flex;gap:11px;align-items:center;padding:7px 8px;border-radius:9px;cursor:pointer}.cls:hover{background:var(--bg3)}.cls img,.cls .ph{width:32px;height:32px;object-fit:contain;flex:none}.cls b{display:block;font-size:14px}.cls small{color:var(--mut);font-size:12.3px;line-height:1.35;display:block}
.duo{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.duo .card{display:flex;gap:14px;cursor:pointer;margin:0}.duo .card:hover{border-color:var(--acc)}.duo img,.duo .ph{width:48px;height:48px;object-fit:contain;flex:none}
/* ---------- tabelas, modal, formulários ---------- */
table{border-collapse:collapse;width:100%}td,th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mut);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tscroll{overflow-x:auto}
#modal{position:fixed;inset:0;background:color-mix(in srgb,#05070b 70%,transparent);display:none;align-items:flex-start;justify-content:center;padding:50px max(16px,env(safe-area-inset-left,0px));z-index:50;overflow:auto}
#modal .box{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;max-width:800px;width:100%;position:relative;box-shadow:var(--shade);overflow:hidden}
#modal .mh{display:flex;gap:16px;align-items:center;padding:18px 22px;background:var(--hero);border-bottom:1px solid var(--line)}
#modal .mh .ic{width:78px;height:78px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden}#modal .mh .ic img{max-width:68px;max-height:72px}
#modal .mh h2{margin:0;font:400 24px var(--f-display)}#modal .mb{padding:16px 22px 22px;overflow-x:auto}
#modal .x{position:absolute;right:14px;top:8px;font-size:26px;cursor:pointer;color:var(--mut)}
pre.ds{white-space:pre-wrap;font:13.5px/1.55 var(--f-body);color:var(--tx2);background:var(--bg3);padding:12px 14px;border-radius:10px;margin:10px 0}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.kv div{background:var(--bg3);padding:7px 10px;border-radius:8px;font-family:var(--f-num);font-size:13.5px}.kv span{color:var(--mut);font:11.5px var(--f-body);display:block}
input[type=search],select{background:var(--bg3);border:1px solid var(--line);color:var(--tx);padding:9px 12px;border-radius:9px;font:inherit;width:100%}
input[type=range]{accent-color:var(--acc)}
.res .row{display:flex;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}.res .row:hover{background:var(--bg3)}
.res .row img,.res .row .ph{width:28px;height:28px;object-fit:contain}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.plan label{background:var(--bg2);border:1px solid var(--line);padding:10px 12px;border-radius:10px;display:block}.plan input[type=range]{width:100%}
.mut{color:var(--mut)}.ok{color:var(--ok)}.nao{color:var(--bad)}.fora{color:var(--warn)}
.ph{display:inline-block;width:28px;height:28px;flex:none;border-radius:6px;background:repeating-linear-gradient(45deg,var(--bg4) 0 5px,transparent 5px 10px)}
@media(max-width:1150px){.page{grid-template-columns:1fr}.infobox{position:static;order:-1}.gs{width:220px}.gsr{width:340px}}
@media(max-width:860px){
  .wrap{display:block}#side{position:static;width:auto;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  #view{padding-block:18px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .sg{grid-template-columns:repeat(3,1fr)}.phase{grid-template-columns:1fr}.phase .txt{grid-column:1}
  .sk{grid-template-columns:28px 1fr 56px}.sk .why,.sk .sel{grid-column:2/4}.sk.head{display:none}
  .duo,.stats4,.plan{grid-template-columns:1fr}.hwrap{flex-wrap:wrap}.hright{width:100%}.gs{flex:1}.gsr{width:100%}
  .hero2{flex-direction:column;align-items:flex-start;padding:22px}.hero2 h1{font-size:32px}h1.t{font-size:28px}
}


/* ---------- skill tooltip ---------- */
.sk-wrap{position:relative;display:inline-flex;align-items:center}
.sk-tip{
  display:none;position:fixed;z-index:200;
  width:280px;background:var(--bg2);border:1px solid var(--line2);
  border-radius:14px;box-shadow:0 8px 32px #0005,0 2px 8px #0003;
  padding:0;text-align:left;cursor:default;overflow:hidden;
  max-height:80vh;overflow-y:auto;
}
.sk-tip.vis{display:block}


.sk-tip .sth{display:flex;gap:10px;align-items:center;padding:12px 14px 10px;background:var(--hero);border-bottom:1px solid var(--line)}
.sk-tip .sth img,.sk-tip .sth .ph{width:38px;height:38px;flex:none;filter:drop-shadow(0 2px 4px #0004)}
.sk-tip .sth b{font-size:13.5px;display:block;line-height:1.3}
.sk-tip .sth small{color:var(--mut);font-size:11.5px;display:block;margin-top:3px}
.sreq-lbl{padding:8px 14px 4px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--mut)}
.sk-tip .sreq{margin:0;padding:0 0 8px;list-style:none}
.sk-tip .sreq li{display:flex;align-items:center;gap:9px;padding:5px 14px;font-size:13px;border-bottom:1px solid var(--line)}
.sk-tip .sreq li:last-child{border:0}
.sk-tip .sreq li img,.sk-tip .sreq li .ph{width:26px;height:26px;flex:none}
.sk-tip .sreq li span{flex:1;line-height:1.3}
.sk-tip .sreq li b{font-family:var(--f-num);font-size:12px;color:var(--acc2);background:var(--accbg);border-radius:5px;padding:1px 6px;white-space:nowrap}
.sk-tip .snone{color:var(--mut);font-size:12.5px;padding:10px 14px;margin:0;font-style:italic}.sk-desc{padding:8px 14px 12px;font-size:12.5px;line-height:1.55;color:var(--tx2);border-top:1px solid var(--line);white-space:pre-line;max-height:160px;overflow-y:auto}

/* Mobile TOC como barra de âncoras */
@media(max-width:860px){
  .toc{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;border-top:1px solid var(--line)}

  .toc a:hover{background:var(--accbg);color:var(--acc2)}
}
